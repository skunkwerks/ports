-- drop PEP 639 license fields and relax the setuptools version
-- requirement to match devel/py-setuptools in ports

--- pyproject.toml.orig	2026-09-21 09:30:11 UTC
+++ pyproject.toml
@@ -7,8 +7,6 @@ requires-python = ">=3.10"
 description = "A Python module and script to synchronise media purchased on bandcamp.com with a local directory."
 readme = "README.md"
 requires-python = ">=3.10"
-license = "BSD-3-Clause"
-license-files = ["LICENSE",]
 dependencies = [
     "beautifulsoup4>=4.14.3",
     "curl-cffi>=0.14.0",
@@ -43,5 +41,5 @@ dev = [
 ]
 
 [build-system]
-requires = ["setuptools >= 77.0.3"]
+requires = ["setuptools"]
 build-backend = "setuptools.build_meta"
