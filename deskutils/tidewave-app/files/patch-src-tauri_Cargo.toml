--- src-tauri/Cargo.toml.orig	2026-09-15 10:01:27 UTC
+++ src-tauri/Cargo.toml
@@ -37,8 +37,13 @@ tauri-plugin-cli = "2"
 
 [target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
 tauri-plugin-cli = "2"
-tauri-plugin-updater = "2"
 tauri-plugin-autostart = "2"
+
+# tauri-plugin-updater only knows how to update AppImage/deb (Linux), .app (macOS)
+# and NSIS/MSI (Windows). On FreeBSD it has no update path, and a port is updated
+# by pkg, so it is excluded there.
+[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "freebsd")))'.dependencies]
+tauri-plugin-updater = "2"
 
 [target.'cfg(target_os = "macos")'.dependencies]
 objc2 = "0.6"
