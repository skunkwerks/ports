# Rotate the casa syslog file daily, or at 100 megabytes, keep seven.
# The pid file slot names syslogd, which newsyslog signals to reopen
# the file after it is rotated, since casa itself only ever writes to
# syslog.
# logfilename		[owner:group]	mode	count	size	when	flags	[/pid_file]	[sig_num]
/var/log/casa.log	root:wheel	640	7	100M	@T00	JC	/var/run/syslog.pid
